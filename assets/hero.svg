<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Madeswaran J V - Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1c1807"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9C4"/>
      <stop offset="1" stop-color="#FFC400"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <polygon id="bolt" points="500,-10 455,105 495,105 440,215 478,215 425,335 545,190 505,190 565,95 528,95 562,-10"/>
  </defs>

  <style>
    .hide { opacity: 0; }
    @keyframes flicker {
      0% { opacity: 0 } 8% { opacity: 1 } 16% { opacity: .15 } 28% { opacity: 1 }
      44% { opacity: .25 } 60% { opacity: .9 } 100% { opacity: 0 }
    }
    @keyframes flash {
      0%, 12% { opacity: 0 } 13.3% { opacity: .3 } 15% { opacity: 0 }
      30% { opacity: .3 } 32% { opacity: 0 }
      50% { opacity: .85 } 52% { opacity: .1 } 54% { opacity: .6 } 60%, 100% { opacity: 0 }
    }
    @keyframes reveal {
      0% { opacity: 0 } 8% { opacity: 1 } 18% { opacity: .15 } 30% { opacity: 1 }
      44% { opacity: .4 } 58% { opacity: 1 } 100% { opacity: 1 }
    }
    @keyframes revealGlow {
      0% { opacity: 0 } 8% { opacity: .9 } 18% { opacity: .1 } 30% { opacity: .9 }
      44% { opacity: .3 } 58% { opacity: .8 } 100% { opacity: .7 }
    }
    @keyframes pulse { from { opacity: .45 } to { opacity: .9 } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) }
      to   { opacity: 1; transform: translateY(0) }
    }
    @keyframes idle {
      0%, 86% { opacity: 0 } 88% { opacity: .9 } 90% { opacity: .1 }
      92% { opacity: .8 } 95%, 100% { opacity: 0 }
    }

    .bL { animation: flicker .9s linear .4s both; }
    .bR { animation: flicker .9s linear .9s both; }
    .bC { animation: flicker 1.3s linear 1.5s both; }
    .flashrect { animation: flash 3s linear 0s both; }
    .nameGlow { animation: revealGlow 1.4s linear 1.55s both, pulse 3s ease-in-out 3s infinite alternate; }
    .name { animation: reveal 1.4s linear 1.55s both; }
    .uline { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .7s ease-out 2.5s both; }
    .sub  { animation: rise .7s ease-out 2.7s both; }
    .tech { animation: rise .7s ease-out 3.2s both; }
    .quote { animation: rise .7s ease-out 3.7s both; }
    .idle1 { opacity: 0; animation: idle 7s linear 5s infinite; }
    .idle2 { opacity: 0; animation: idle 7s linear 8.5s infinite; }
  </style>

  <!-- background card -->
  <rect x="0" y="0" width="1000" height="380" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="378" rx="18" fill="none" stroke="#FFD500" stroke-opacity=".25"/>

  <!-- idle mini bolts (flash now and then after the intro) -->
  <g class="idle1" filter="url(#glow)"><use xlink:href="#bolt" transform="translate(-78 33) scale(.3)" fill="#FFE600"/></g>
  <g class="idle2" filter="url(#glow)"><use xlink:href="#bolt" transform="translate(792 200) scale(.3)" fill="#FFE600"/></g>

  <!-- strike 1: left -->
  <g class="bL hide" filter="url(#glow)">
    <use xlink:href="#bolt" transform="translate(-210 0) scale(.8)" fill="#FFE600" stroke="#FFF9C4" stroke-width="1.5"/>
    <polyline points="250,150 190,170 205,195 150,215" fill="none" stroke="#FFE600" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- strike 2: right -->
  <g class="bR hide" filter="url(#glow)">
    <use xlink:href="#bolt" transform="translate(430 -10) scale(.75)" fill="#FFE600" stroke="#FFF9C4" stroke-width="1.5"/>
    <polyline points="790,120 850,138 835,162 890,182" fill="none" stroke="#FFE600" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- strike 3: centre, hits the name -->
  <g class="bC hide" filter="url(#glow)">
    <use xlink:href="#bolt" fill="#FFE600" stroke="#FFF9C4" stroke-width="2"/>
    <polyline points="478,215 400,238 420,262 350,288" fill="none" stroke="#FFE600" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="545,190 612,205 592,230 662,252" fill="none" stroke="#FFE600" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="455,105 395,112 410,135 355,150" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- screen flash -->
  <rect class="flashrect hide" x="0" y="0" width="1000" height="380" rx="18" fill="#FFF3A0"/>

  <!-- name -->
  <text class="nameGlow hide" x="500" y="205" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="64" textLength="820" lengthAdjust="spacingAndGlyphs" fill="#FFD500" filter="url(#soft)">MADESWARAN J V</text>
  <text class="name hide" x="500" y="205" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI', sans-serif" font-weight="900" font-size="64" textLength="820" lengthAdjust="spacingAndGlyphs" fill="url(#nameGrad)">MADESWARAN J V</text>

  <!-- underline -->
  <line class="uline" x1="300" y1="232" x2="700" y2="232" stroke="#FFD500" stroke-width="3" stroke-linecap="round"/>

  <!-- other content -->
  <text class="sub hide" x="500" y="274" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="24" textLength="470" lengthAdjust="spacing" fill="#FFD500">FULL STACK DEVELOPER</text>
  <text class="tech hide" x="500" y="312" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" textLength="580" lengthAdjust="spacing" fill="#E6EDF3">React  •  Next.js  •  Node.js  •  MongoDB  •  AWS</text>
  <text class="quote hide" x="500" y="344" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-style="italic" font-size="15" textLength="340" lengthAdjust="spacing" fill="#8B949E">Push past the limit. Ship. Repeat.</text>
</svg>
