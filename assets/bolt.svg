<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="Animated yellow thunderbolt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#241e06"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <polygon id="bolt" points="500,-10 455,105 495,105 440,215 478,215 425,335 545,190 505,190 565,95 528,95 562,-10"/>
  </defs>

  <style>
    @keyframes pulse { from { opacity: .35 } to { opacity: .85 } }
    @keyframes boltPulse { from { opacity: .82 } to { opacity: 1 } }
    @keyframes arc {
      0%, 100% { opacity: 0 } 4% { opacity: 1 } 7% { opacity: 0 }
      11% { opacity: .85 } 14% { opacity: 0 }
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 0 }
      15% { opacity: 1 }
      100% { transform: translateY(-110px); opacity: 0 }
    }
    .halo { animation: pulse 2.2s ease-in-out infinite alternate; }
    .core { animation: boltPulse 1.4s ease-in-out infinite alternate; }
    .arc { opacity: 0; }
    .a1 { animation: arc 3.2s linear 0s infinite; }
    .a2 { animation: arc 3.2s linear 1.1s infinite; }
    .a3 { animation: arc 3.2s linear 2.0s infinite; }
    .a4 { animation: arc 3.2s linear 0.6s infinite; }
    .p { opacity: 0; }
    .p1 { animation: float 3.4s ease-out 0s infinite; }
    .p2 { animation: float 4.1s ease-out .8s infinite; }
    .p3 { animation: float 3.7s ease-out 1.6s infinite; }
    .p4 { animation: float 4.4s ease-out 2.2s infinite; }
    .p5 { animation: float 3.9s ease-out 2.9s infinite; }
    .p6 { animation: float 3.3s ease-out 1.2s infinite; }
  </style>

  <rect x="0" y="0" width="400" height="520" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="518" rx="18" fill="none" stroke="#FFD500" stroke-opacity=".25"/>

  <!-- halo behind the bolt -->
  <g class="halo"><use xlink:href="#bolt" transform="translate(-394 52) scale(1.2)" fill="#FFD500" filter="url(#soft)"/></g>

  <!-- electric arcs -->
  <g filter="url(#glow)" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <polyline class="arc a1" points="90,130 125,150 108,176 150,198"/>
    <polyline class="arc a2" points="310,190 280,212 296,238 258,262"/>
    <polyline class="arc a3" points="85,310 120,328 104,352 142,374"/>
    <polyline class="arc a4" points="318,340 288,360 303,384 268,404"/>
  </g>

  <!-- the bolt -->
  <g class="core" filter="url(#glow)">
    <use xlink:href="#bolt" transform="translate(-394 52) scale(1.2)" fill="#FFE600" stroke="#FFF9C4" stroke-width="1.5"/>
  </g>

  <!-- rising sparks -->
  <g fill="#FFE600">
    <circle class="p p1" cx="150" cy="440" r="3"/>
    <circle class="p p2" cx="250" cy="450" r="2.5"/>
    <circle class="p p3" cx="205" cy="460" r="3.5"/>
    <circle class="p p4" cx="110" cy="420" r="2"/>
    <circle class="p p5" cx="290" cy="420" r="2.5"/>
    <circle class="p p6" cx="185" cy="430" r="2"/>
  </g>

  <text x="200" y="498" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="14" textLength="250" lengthAdjust="spacing" fill="#FFD500" fill-opacity=".8">PUSH PAST THE LIMIT</text>
</svg>
